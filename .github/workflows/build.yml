name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET Framework
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      
    - name: Restore NuGet packages
      run: nuget restore AsmSpy.sln
      
    - name: Build solution
      run: msbuild AsmSpy.sln /p:Configuration=Debug /p:Platform="Any CPU" /verbosity:minimal
      
    - name: Run tests
      run: dotnet test AsmSpy.Core.Tests/AsmSpy.Core.Tests.csproj --configuration Debug --no-build --verbosity normal
      
    - name: Create artifacts directory
      run: mkdir artifacts
      
    - name: Create ZIP artifact
      run: 7z a artifacts/asmspy.${{ github.run_number }}.zip ./AsmSpy.CommandLine/bin/Debug/AsmSpy.exe
      
    - name: Pack Chocolatey package
      run: choco pack ./AsmSpy.CommandLine/AsmSpy.nuspec --version ${{ github.run_number }} --outputdirectory artifacts
      
    - name: Pack NuGet package
      run: nuget pack ./AsmSpy.Core/AsmSpy.Core.nuspec -version ${{ github.run_number }} -outputdirectory artifacts
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: artifacts/